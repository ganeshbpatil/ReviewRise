version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reviewrise-app
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://reviewrise:${POSTGRES_PASSWORD}@postgres:5432/reviewrise
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reviewrise-net
    labels:
      - "com.reviewrise.service=app"

  postgres:
    image: postgres:16-alpine
    container_name: reviewrise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reviewrise
      POSTGRES_USER: reviewrise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewrise -d reviewrise"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reviewrise-net

  redis:
    image: redis:7-alpine
    container_name: reviewrise-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reviewrise-net

  nginx:
    image: nginx:alpine
    container_name: reviewrise-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - reviewrise-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: reviewrise-worker
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://reviewrise:${POSTGRES_PASSWORD}@postgres:5432/reviewrise
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reviewrise-net

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  nginx-logs:
    driver: local

networks:
  reviewrise-net:
    driver: bridge
